<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&amp;family=Zen+Maru+Gothic:wght@500;700;900&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#ECEAE5}
.root{--bg:#ECEAE5;--fg:#232427;--muted:#5A5B5F;--line:#232427;--hair:#CFCBC3;--grid:#D9D6CF;--surf:#F8F7F3;--inv:#232427;--invfg:#F8F7F3;--invmuted:#A9A8A3;--shadow:#232427;--ph:#E2DFD8;--chip:#E2DFD8;--cbg:#232427;--cfg:#F8F7F3;--cmuted:#A9A8A3;--cline:#55565B;--cgrid:#2F3034;--fshadow:#E8731A;--num:#E8731A;transition:background-color .3s,color .3s}
.root.dark{--bg:#17181B;--fg:#ECEAE5;--muted:#A3A3A0;--line:#5E6167;--hair:#34363B;--grid:#26282C;--surf:#222428;--inv:#ECEAE5;--invfg:#17181B;--invmuted:#55565B;--shadow:#ECEAE5;--ph:#2A2C31;--chip:#2E3035;--cbg:#E4E1DA;--cfg:#232427;--cmuted:#5A5B5F;--cline:#9E9B94;--cgrid:#D6D3CC;--fshadow:#232427;--num:#B85510}
.root a{color:var(--fg)}.root a:hover{color:var(--fg);opacity:.8}
.logoW{display:none}.root.dark .logoW{display:inline}.root.dark .logoB{display:none}
.logoBc{display:none}.root.dark .logoBc{display:inline}.root.dark .logoWc{display:none}
.sun{display:none}.root.dark .sun{display:block}.root.dark .moon{display:none}
.shape{border-radius:4px;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%)}
.shapeL{border-radius:6px;clip-path:polygon(0 0,calc(100% - 44px) 0,100% 44px,100% 100%,0 100%)}
.chip{display:inline-flex;align-items:center;height:28px;padding:0 12px;font-size:13px;font-weight:700;border-radius:3px;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%);white-space:nowrap;color:#232427}
.shadow{filter:drop-shadow(3px 3px 0 var(--shadow))}
.shadowF{filter:drop-shadow(3px 3px 0 var(--fshadow))}
.shadowInk{filter:drop-shadow(3px 3px 0 #232427)}
.lift{transition:transform .15s,filter .15s}
.lift:hover{transform:translate(-2px,-2px);filter:drop-shadow(5px 5px 0 var(--shadow))}
.tilt{rotate:-4deg}
.px{image-rendering:pixelated;width:40px}
.mono{font-family:'JetBrains Mono',monospace}
.disp{font-family:'Saira Condensed',sans-serif;font-weight:800;line-height:0.8;letter-spacing:-2px}
.grid{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:48px 48px}
.cgrid{background-image:linear-gradient(var(--cgrid) 1px,transparent 1px),linear-gradient(90deg,var(--cgrid) 1px,transparent 1px);background-size:48px 48px}
.tape{background-image:repeating-linear-gradient(-45deg,#E8731A 0 12px,#232427 12px 24px);animation:tape 1.6s linear infinite}
.tick{position:absolute;width:18px;height:18px;border-color:#232427;border-style:solid;border-width:0}
.tbar{height:34px;display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--inv);color:var(--invmuted);font-family:'JetBrains Mono',monospace;font-size:12px;flex-shrink:0}
.dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.icon{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--surf);color:var(--fg)}
.kao{position:relative;display:inline-block;height:1.5em;min-width:9em}
.kao span{position:absolute;left:0;top:0;white-space:nowrap;opacity:0;animation:kao 6s steps(1,end) infinite}
.kao span:nth-child(1){animation-delay:0s}
.kao span:nth-child(2){animation-delay:-4s}
.kao span:nth-child(3){animation-delay:-2s}
@keyframes kao{0%{opacity:1}33.3%{opacity:0}100%{opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes rise{from{transform:translateY(48px);opacity:0}to{transform:none;opacity:1}}
@keyframes slide{from{transform:translateX(80px);opacity:0}to{transform:none;opacity:1}}
@keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes typeLoop{0%{clip-path:inset(0 100% 0 0)}45%,100%{clip-path:inset(0 0 0 0)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes tape{to{background-position:34px 0}}
.bob{animation:bob 1.2s steps(2,jump-none) infinite}
.cursor{animation:blink 1.1s steps(1,end) infinite}
.a-rise{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.a-slide{animation:slide .9s cubic-bezier(.2,.8,.2,1) both}
.a-pop{animation:pop .5s cubic-bezier(.2,.8,.2,1) both}
.a-type7{animation:type .9s steps(7,end) both}
.a-type6{animation:type .6s steps(8,end) both}
.a-typeLoop{animation:typeLoop 5s steps(16,end) infinite}
@media (prefers-reduced-motion: reduce){.bob,.cursor,.tape,.a-rise,.a-slide,.a-pop,.a-type7,.a-type6,.a-typeLoop{animation:none}.kao span{animation:none}.kao span:nth-child(1){opacity:1}.lift,.root{transition:none}}
</style>
</helmet>

<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const t = (this.state && this.state.theme) || this.props.theme || 'light';
    return {
      themeClass: t === 'dark' ? 'dark' : '',
      toggleTheme: () => this.setState({ theme: t === 'dark' ? 'light' : 'dark' })
    };
  }
}
</script>
